name: Build native ZPEX plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 dylib
            os: macos-14
            artifact: zpe-lib-docx-macos-arm64
            output: build/native/zpe.lib.docx.dylib
          - name: Windows x64 DLL
            os: windows-2022
            artifact: zpe-lib-docx-windows-x64
            output: build/native/zpe.lib.docx.dll
          - name: Linux x64 shared library
            os: ubuntu-24.04
            artifact: zpe-lib-docx-linux-x64
            output: build/native/zpe.lib.docx.so

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out zpe.lib.docx
        uses: actions/checkout@v5

      - name: Set up GraalVM Native Image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: "true"

      - name: Enable the MSVC x64 toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INCLUDE=$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBPATH=$env:LIBPATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Apache POI dependencies
        shell: bash
        run: ./download-native-dependencies.sh build/native-dependencies

      - name: Build native DOCX plugin
        shell: bash
        env:
          ZPE_DEPENDENCY_DIR: build/native-dependencies
          BUILD_STATIC_PLUGIN: "false"
        run: ./build-native.sh

      - name: Verify native plugin
        shell: bash
        run: test -f "${{ matrix.output }}"

      - name: Upload native plugin
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 30
